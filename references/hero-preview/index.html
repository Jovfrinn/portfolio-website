<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hero Preview</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{margin:0;background:#f8f3e8;transition:background-color .8s ease}
@import url("https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Raleway:wght@500;600&display=swap");

.hero {
  --cream: #f8f3e8;
  --ink: #1f2a37;
  --teal: #2f5d56;
  --teal-text: #2f5d56;
  --chip: #efe7d8;
  background: var(--cream);
  transition: background-color 0.8s ease, color 0.8s ease;
  padding: 64px 0 40px;
  overflow: hidden;
}

.hero-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 20px;
  border-radius: 999px;
  background: var(--chip);
  color: var(--ink);
  font: 600 clamp(14px, 1.1vw, 17px)/1 "Raleway", sans-serif;
  margin-bottom: 28px;
}

.hero-title {
  font: 800 clamp(52px, 7vw, 112px) / 1.02 "Nunito", sans-serif;
  color: var(--ink);
  letter-spacing: -0.01em;
  margin: 0 0 20px;
}

.hero-sub {
  font: 500 clamp(21px, 2.5vw, 36px) / 1.3 "Raleway", sans-serif;
  color: var(--ink);
  max-width: 560px;
  margin-bottom: 32px;
}

.hero-btn {
  display: inline-block;
  padding: clamp(16px, 1.3vw, 22px) clamp(32px, 2.5vw, 44px);
  border-radius: 999px;
  font: 600 clamp(17px, 1.3vw, 21px)/1 "Raleway", sans-serif;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.hero-btn:hover { transform: translateY(-2px); }
.hero-btn-primary {
  background: var(--teal);
  color: #fff;
  box-shadow: 0 8px 18px rgba(47, 93, 86, 0.3);
}
.hero-btn-primary:hover { color: #fff; }
.hero-btn-outline {
  color: var(--teal-text);
  border: 2px solid var(--teal-text);
  background: transparent;
}
.hero-btn-outline:hover { color: var(--teal-text); }

/* ---------- stage: jendela + orang ---------- */
.hero-stage {
  position: relative;
  width: 100%;
  max-width: min(1000px, calc((100vh - 130px) * 0.957));
  margin-left: auto;
  margin-right: 0;
  aspect-ratio: 785 / 820;
}

.hero-window {
  position: absolute;
  top: 3.2%;
  left: 20%;
  width: 80%;
  height: 68.5%;
}

/* scene duduk di dalam bingkai (frame ~27px dari 620) */
.hero-scene {
  position: absolute;
  top: 3.6%;
  left: 4.5%;
  width: 92.8%;
  height: 94.3%;
  object-fit: cover;
  object-position: 50% 40%;
  animation: sceneIn 0.6s ease;
}

.hero-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}


@keyframes sceneIn {
  from { opacity: 0; transform: scale(1.03); }
  to { opacity: 1; transform: scale(1); }
}

.hero-switch {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 16px;
}
.hero-switch button {
  border: 0;
  background: var(--chip);
  color: var(--ink);
  font: 600 13px/1 "Raleway", sans-serif;
  padding: 8px 14px;
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s;
}
.hero-switch button.active { background: var(--teal); color: #fff; }

@media (max-width: 991px) {
  .hero { padding: 40px 0 24px; }
  .hero-text { text-align: left; }
}

/* layout: teks sejajar container, gambar mentok kanan layar */
.hero-wrap {
  padding-left: max(24px, calc((100vw - 1320px) / 2 + 12px));
  padding-right: 0;
}
.hero-wrap .row { margin-right: 0; }
.hero-right { padding-right: 0 !important; }
@media (max-width: 991px) {
  .hero-wrap { padding-right: 0; }
  .hero-stage { max-width: 560px; }
}

/* ---------- orang: body + kepala + tangan + efek ---------- */
.hero-person {
  position: absolute;
  left: 10.8%;
  bottom: 0;
  width: 96.8%;
  aspect-ratio: 1076 / 664;
  animation: sceneIn 0.6s ease;
}
.hp-layer {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.hp-fx { overflow: visible; }

/* kepala: menoleh tipis ke layar */
.hp-head {
  transform-origin: 67.8% 35.4%;
  animation: headLook 8s ease-in-out infinite;
}
@keyframes headLook {
  0%, 100% { transform: rotate(0deg) translateY(0); }
  18% { transform: rotate(-2.6deg) translate(-1.5px, 0); }
  38%, 52% { transform: rotate(1.8deg) translateY(2px); }
  72% { transform: rotate(-1.2deg) translateY(1px); }
}

/* tangan: mengetik */
.hp-hand {
  transform-origin: 45.5% 70.8%;
  animation: typing 2.4s ease-in-out infinite;
}
@keyframes typing {
  0%, 100% { transform: translate(0, 0) rotate(0deg); }
  8% { transform: translate(0, -3px) rotate(-1.2deg); }
  16% { transform: translate(0, 0.4px) rotate(0deg); }
  30% { transform: translate(0.8px, -2.2px) rotate(1deg); }
  38% { transform: translate(0, 0); }
  55% { transform: translate(0, -3px) rotate(-0.9deg); }
  63% { transform: translate(0, 0.5px); }
  80% { transform: translate(1px, -1.8px) rotate(0.8deg); }
}

/* layar laptop: baris kode "diketik" */
.hp-line {
  fill: var(--line);
  opacity: 0.92;
  transform-box: fill-box;
  transform-origin: left center;
  transform: scaleX(0);
  animation: codeType 9s ease-out infinite;
  animation-delay: calc(var(--i) * 0.55s);
}
@keyframes codeType {
  0% { transform: scaleX(0); opacity: 0.92; }
  7% { transform: scaleX(1); }
  80% { transform: scaleX(1); opacity: 0.92; }
  90% { transform: scaleX(1); opacity: 0; }
  100% { transform: scaleX(0); opacity: 0; }
}

/* uap kopi */
.hp-steam {
  opacity: 0;
  animation: steamRise var(--t, 5.6s) ease-in infinite;
  animation-delay: var(--d, 0s);
}
.hp-wisp {
  fill: none;
  stroke: var(--steam);
  stroke-width: 4.4;
  stroke-linecap: round;
  transform-box: fill-box;
  transform-origin: 50% 100%;
  animation: steamSway 2.6s ease-in-out infinite alternate;
}
@keyframes steamRise {
  0% { opacity: 0; transform: translateY(5px) scaleY(0.7); }
  22% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-46px) scaleY(1.5); }
}
@keyframes steamSway {
  from { transform: translateX(-5px) skewX(-9deg); }
  to { transform: translateX(5px) skewX(9deg); }
}

@media (prefers-reduced-motion: reduce) {
  .hp-head, .hp-hand, .hp-steam, .hp-wisp { animation: none; }
  .hp-line { animation: none; transform: none; }
  .hp-steam { opacity: 0.5; }
}

/* ---------- tema per scene ---------- */
.hero-badge, .hero-switch button { transition: background-color 0.8s ease, color 0.8s ease; }
.hero-badge svg circle { fill: currentColor; }
.hero-badge svg path { stroke: var(--cream); }

.hero[data-scene="malam"] {
  --cream: #0f1733;
  --ink: #eee9dc;
  --chip: #1d2850;
  --teal: #3f8f84;
  --teal-text: #8fd6cb;
}
.hero[data-scene="hujan"] {
  --cream: #c6cbd1;
  --ink: #1d2733;
  --chip: #b4bbc3;
  --teal: #2f5d56;
  --teal-text: #2b5750;
}
</style></head><body>
<section class="hero" id="hero"><div class="container-fluid hero-wrap"><div class="row align-items-center g-5">
<div class="col-lg-5 hero-text">
<span class="hero-badge"><svg width="18" height="18" viewBox="0 0 20 20"><circle cx="10" cy="10" r="10"/><path d="M5.5 10.3l3 3 6-6.3" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Available for freelance projects</span>
<h1 class="hero-title">Full-Stack<br>Developer.</h1>
<p class="hero-sub">Building CRM &amp; CMS that actually get used.</p>
<div class="d-flex flex-wrap gap-3"><a href="#projects" class="hero-btn hero-btn-primary">View projects</a><a href="#contact" class="hero-btn hero-btn-outline">Contact me</a></div>
</div>
<div class="col-lg-7 hero-right">
<div class="hero-stage"><div class="hero-window"><img id="scene" class="hero-scene" src="assets/siang.svg" alt=""><img class="hero-frame" src="assets/jendela.svg" alt=""></div>
<div id="person"></div></div>
</div></div></div></section>
<script>
const S=[
 {k:"pagi",l:"Pagi",line:"228,187,155",steam:"255,255,255,.62"},
 {k:"siang",l:"Siang",line:"175,199,215",steam:"255,255,255,.68"},
 {k:"sore",l:"Sore",line:"175,117,86",steam:"255,236,205,.62"},
 {k:"malam",l:"Malam",line:"170,179,218",steam:"205,215,255,.5"},
 {k:"hujan",l:"Hujan",line:"170,181,186",steam:"235,240,245,.55"}];
const POLY="363,273 561,268 565,296 566,315 557,326 546,348 546,357 551,358 549,367 544,377 533,378 525,397 376,405";
const BARS=[[451,297,44,8],[394,311,102,10],[429,324,68,10],[398,345,99,11],[438,357,59,10],[457,371,40,8],[523,292,31,7],[523,305,32,8],[527,319,29,7],[529,339,19,7],[538,330,10,4]];
const STEAM=[{x:-9,d:"0s",t:"5.6s"},{x:0,d:"-1.9s",t:"6.2s"},{x:9,d:"-3.7s",t:"5.2s"}];
function personHTML(s){
 const bars=BARS.map(([x,y,w,h],i)=>`<rect class="hp-line" x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" style="--i:${i}"/>`).join("");
 const st=STEAM.map(a=>`<g transform="translate(${a.x} 0)"><g class="hp-steam" style="--d:${a.d};--t:${a.t}"><path class="hp-wisp" d="M0 0C-7-9 7-17 0-27S-6-44 1-54"/></g></g>`).join("");
 return `<div class="hero-person" style="--line:rgb(${s.line});--steam:rgba(${s.steam})">
 <img class="hp-layer" src="assets/body-${s.k}.webp" alt="">
 <img class="hp-layer hp-head" src="assets/head-${s.k}.webp" alt="">
 <img class="hp-layer hp-hand" src="assets/hand-${s.k}.webp" alt="">
 <svg class="hp-layer hp-fx" viewBox="0 0 1076 664"><defs><clipPath id="hp-screen"><polygon points="${POLY}"/></clipPath><filter id="hp-blur" x="-50%" y="-20%" width="200%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter></defs>
 <g clip-path="url(#hp-screen)">${bars}</g><g transform="translate(297 428)" filter="url(#hp-blur)">${st}</g></svg></div>`;
}
const h=new Date().getHours();
let cur=h>=5&&h<10?"pagi":h>=10&&h<15?"siang":h>=15&&h<18?"sore":"malam";
const img=document.getElementById("scene"),per=document.getElementById("person");
function set(k){cur=k;const s=S.find(x=>x.k===k);document.getElementById("hero").dataset.scene=k;document.body.style.background=({malam:"#0f1733",hujan:"#c6cbd1"})[k]||"#f8f3e8";
 img.src="assets/"+k+".svg";img.style.animation="none";img.offsetWidth;img.style.animation="";
 per.innerHTML=personHTML(s);}
const q=new URLSearchParams(location.search).get("scene"); // tes: ?scene=hujan
set(S.some(x=>x.k===q)?q:cur);
if(!q)fetch("https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true").then(r=>r.json()).then(d=>{const c=d&&d.current_weather&&d.current_weather.weathercode;if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95)set("hujan")}).catch(()=>{});
</script></body></html>
